name: Renderer platforms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  renderer-contract:
    name: Renderer contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUNTIME_PYTHON: python
      PROFESSIONAL_SLIDES_RENDERER: libreoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s evals/tests -p test_renderer_backends.py -v
      # Hosted runners do not include a licensed Office desktop. These tests
      # cover selection, commands, file isolation, and fallback, not native
      # PowerPoint rendering; the Mac exporter is also exercised locally.
